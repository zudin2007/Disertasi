name: Build Dissertation (PDF + DOCX)

on:
  push:
    branches:
      - main
    paths:
      - 'CHAPTER_*.md'
      - 'APPENDIX_*.md'
      - 'ABSTRACT.md'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pdf-generation.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (pinned)
        run: npm ci

      - name: Ensure Chromium is present
        run: npx puppeteer browsers install chrome

      - name: Build PDF + DOCX
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dissertation
          path: |
            Dissertation_Full.pdf
            Dissertation_Full.docx
          retention-days: 30

      - name: Commit rebuilt outputs if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add Dissertation_Full.pdf Dissertation_Full.docx || true
          if ! git diff --staged --quiet; then
            git commit -m "ci: rebuild dissertation PDF + DOCX [skip ci]"
            git push
          else
            echo "No changes to compiled outputs."
          fi
